name: scaleway-provider
kind: model-provider
version: 1.1.0
description: Scaleway Generative APIs — European OpenAI-compatible inference
author: Reda Maizate
# The first release carrying the models_dev_id and ambient_credentials profile
# fields (added to Hermes main on 2026-10-25): v0.22.6. Releases 0.22.0-0.22.5
# lack them, and without this floor their loader swallows the profile's
# TypeError into a silent "provider scaleway not found".
requires_hermes: ">=0.22.6"
requires_env:
  - SCW_SECRET_KEY
optional_env:
  - SCALEWAY_BASE_URL
