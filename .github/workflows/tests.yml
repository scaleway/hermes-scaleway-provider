name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "53 5 * * *"  # daily, to catch Hermes changes that break the plugin

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest tests -q -rs

  hermes:
    name: end-to-end (Hermes ${{ matrix.ref }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # v0.22.6 is the minimum supported release: the first carrying the
          # models_dev_id / ambient_credentials profile fields (added to Hermes
          # main on 2026-10-25; 0.22.0-0.22.5 do not have them — requires_hermes
          # gates those out). Release tags and main both sync the `dev` group.
          - ref: v0.22.6
            sync: --group dev
          - ref: main
            sync: --group dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.ref }}
          path: hermes
      - uses: astral-sh/setup-uv@v6
      - name: Install Hermes
        working-directory: hermes
        run: uv sync --frozen ${{ matrix.sync }}
      - name: Test against Hermes
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes
        run: hermes/.venv/bin/python -m pytest tests -q -rs
      - name: hermes plugins validate
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: hermes/.venv/bin/python -m hermes_cli.main plugins validate scaleway-provider
